<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Portfolio" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://kit.fontawesome.com/9772da0aa3.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css" />

  <body class="light" id="top">
    <header class="header center">
      <h3>
        <a href="https://evecrui.github.io/github-portfolio/" class="link"
          >EC.</a
        >
      </h3>

      <nav class="nav center">
        <ul class="nav__list center">
          <li class="nav__list-item">
            <a class="link link--nav" href="#projects">Projects</a>
          </li>
          <li class="nav__list-item">
            <a class="link link--nav" href="#skills">Skills</a>
          </li>
          <li class="nav__list-item">
            <a class="link link--nav" href="#contact">Contact</a>
          </li>
        </ul>

        <button type="button" aria-label="toggle theme" class="btn btn--icon">
          <i aria-hidden="true" id="btn-theme" class="fas fa-moon"></i>
        </button>

        <button
          type="button"
          aria-label="toggle navigation"
          class="btn btn--icon nav__hamburger"
        >
          <i aria-hidden="true" class="fas fa-bars"></i>
        </button>

    <main>
      <!-- About -->
      <div class="about center">
        <img src="img_girl.jpg" alt="Cow" style="width:90%;
                                                border-radius: 50%;
                                                border: 15px solid var(--clr-primary);">
        </div>
      </div>

      <!-- About -->
      <div class="about center">
        <h1>Hi, I am <span class="about__name">Eve Cruickshank.</span></h1>
        <h2 class="about__role">A Game Developer.</h2>
        <p class="about__desc">
          I love to work on <b>procedural generation</b>, <b>MR</b>, and <b>VR</b> games using <b>Unity</b> and <b>C#</b>,
          as well as game art using <b>Blender</b> and <b>Asprite</b>
        </p>

        <div class="about__contact center">
          <a href="Resume.pdf">
            <span class="btn btn--outline">Resume</span>
          </a>

          <a
            href="https://github.com/evecrui"
            aria-label="github"
            class="link link--icon"
          >
            <i aria-hidden="true" class="fab fa-github"></i>
          </a>

          <a
            href="mailto:evelyconfused@gmail.com"
            aria-label="email"
            class="link link--icon"
          >
            <i class="fa-solid fa-envelope"></i>
          </a>
        </div>
      </div>

    <footer class="footer">
      <a
        href="https://github.com/rajshekhar26/cleanfolio-minimal"
        class="link footer__link"
      >
        Created By Eve Cruickshank
        <br>Template by Raj Shekhar
      </a>
    </footer>

    <div class="scroll-container">
    <div class="scroll-top">
      <a aria-label="Scroll up" href="#top">
        <i aria-hidden="true" class="fas fa-arrow-up"></i>
      </a>
    </div>
    </div>

    <script src="./script.js"></script>
